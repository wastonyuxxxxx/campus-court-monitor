services:
  tennis-monitor:
    build: .
    restart: unless-stopped
    init: true
    shm_size: 1gb
    env_file:
      - .env
    environment:
      MONITOR_DATA_DIR: /data
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      - tennis-monitor-data:/data
    ports:
      - "127.0.0.1:6080:6080"

volumes:
  tennis-monitor-data:
